[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boleto-extractor"
version = "0.1.0"
description = "Extrator independente de códigos de boletos bancários"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.8",
    "pydantic>=2.10",
    "pymupdf>=1.25",
    "opencv-python-headless>=4.10",
    "zxing-cpp>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-qt>=4.4",
    "pytest-mock>=3.14",
    "mypy>=2.4",
    "ruff>=0.17",
    "pre-commit>=4.0",
    "pyinstaller>=6.22",
    "types-PyYAML",
    "types-requests",
    "types-python-dateutil",
    "pymysql>=1.2.4",
    "keyring",
    "types-PyMySQL",
    "types-tabulate",
    "pandas-stubs",
]


[project.scripts]
boleto-extractor = "boleto_extractor.bootstrap:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boleto_extractor = ["presentation/qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes de integração",
]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
packages = ["boleto_extractor"]
